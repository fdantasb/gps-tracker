; GPS Tracker — M5 Cardputer ADV + Cap LoRa-1262 (GPS ATGM336H)
[env:cardputer-adv]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Cardputer ADV = StampS3A (ESP32-S3FN8, 8MB flash, no PSRAM)
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; M5Cardputer via git: the registry may lag behind ADV support (TCA8418 keyboard)
lib_deps =
    https://github.com/m5stack/M5Cardputer.git
    mikalhart/TinyGPSPlus@^1.0.3

monitor_speed = 115200
extra_scripts = pre:scripts/rename_firmware.py
